# Template only: a maintainer with workflow permission can copy this file to
# .github/workflows/robby-contracts.yml in LAION-AI/Humaneness-Voice.
name: Robby offline contracts
on:
  pull_request:
    paths: ['robby/**', '.github/workflows/robby-contracts.yml']
  push:
    branches: [main]
    paths: ['robby/**', '.github/workflows/robby-contracts.yml']
permissions:
  contents: read
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-21
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy==1.26.4' 'httpx==0.28.1'
      - name: Pure contracts — no GPU, microphone, vendor tree or API credentials
        working-directory: robby
        run: >-
          python -m unittest test_stop_commands test_stop_feedback
          test_conversation_prompt test_conversation_director test_knowledge_tools
          test_live_decisions test_laya_policy test_release_scan test_avatar_actions
      - name: Compile all exported Python without executing model loaders
        run: python -m compileall -q robby
